<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Home</title>

  <!-- Tailwind (optional but recommended since you're using it elsewhere) -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center">

  <div class="bg-white p-8 rounded-lg shadow-md w-96">

    <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">
      Register your home here
    </h1>

    <form action="/host/add-home" method="POST" class="space-y-4">

      <input 
        type="text"
        name="houseName"
        placeholder="Enter the name of your house"
        class="w-full border border-gray-300 p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-400"
        required
      />

      <button 
        type="submit"
        class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 rounded font-semibold transition"
      >
        Submit
      </button>

    </form>

  </div>

</body>
</html>
